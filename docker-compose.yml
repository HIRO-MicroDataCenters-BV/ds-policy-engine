services:
  ds-opa:
    image: openpolicyagent/opa:latest
    container_name: ds-opa
    hostname: ds-opa
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPA_PORT:-8181}:8181"
    command:
      - "run"
      - "--server"
      - "--addr"
      - "0.0.0.0:8181"
      - "--log-level"
      - "info"
      - "--log-format"
      - "json"
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - policy-net

  ds-policy-engine:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ds-policy-engine
    hostname: ds-policy-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POLICY_ENGINE_PORT:-8000}:8000"
    environment:
      DS__OPA_BASE_URL: http://ds-opa:8181
      DS__OPA_TIMEOUT: "3.0"
      DS__OPA_POLICY_PATH: ds/authz/decision
      DS__DATABASE_URL: sqlite+aiosqlite:////app/data/policy_engine.db
      DS__POLICIES_DIR: /code/policies
      DS__LOG_LEVEL: INFO
      DS__NODE_NAME: local
      DS__CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      DS__DOCS_ENABLED: "true"
    volumes:
      - policy-data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      ds-opa:
        condition: service_healthy
    networks:
      - policy-net

networks:
  policy-net:
    driver: bridge

volumes:
  policy-data:
