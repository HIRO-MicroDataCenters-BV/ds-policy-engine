name: Test and build client

on: [push, pull_request, workflow_dispatch]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_client: ${{ steps.check.outputs.has_client }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f client/pyproject.toml ]; then
            echo "has_client=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_client=false" >> "$GITHUB_OUTPUT"
            echo "client/pyproject.toml not present — skipping client job until the OpenAPI client is generated."
          fi

  test_and_build_client:
    needs: [detect]
    if: needs.detect.outputs.has_client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-root

      - name: Check code
        run: |
          poetry run mypy .
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: poetry run pytest

      # The version in PyPI must follow PEP 440. Only clean semver tags publish.
      - name: Build and publish to pypi
        run: |
          if [[ ${{ github.ref }} =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "This is a version tag. Build and publish a package."
            poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
            poetry build
            poetry publish
          else
            echo "This is not a version tag."
          fi
