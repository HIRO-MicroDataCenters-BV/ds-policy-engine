<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ds-policy-engine — API docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />

</head>

      window.ui = SwaggerUIBundle({

        deepLinking: true,

  </script>
</body>
</html>
