[tool.poetry]
name = "ds-policy-engine"
version = "0.1.0"
description = "Standalone policy-as-code microservice (FastAPI + OPA)"
authors = ["HIRO-MicroDataCenters"]
license = "MIT"
readme = "README.md"
packages = [{ include = "*", from = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
httpx = "^0.27.0"
pydantic = "^2.7"
pydantic-settings = "^2.2.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
aiosqlite = "^0.20.0"
asyncpg = "^0.29.0"
alembic = "^1.14.0"
pyyaml = "^6.0"
prometheus-fastapi-instrumentator = "^7.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.8"
flake8 = "^7.0"
isort = "^5.13"
mypy = "^1.10"
types-pyyaml = "^6.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-mock = "^3.12"
pytest-cov = "^5.0"
httpx = "^0.27"
freezegun = "^1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
line_length = 88
profile = "black"
known_typing = ["typing", "types", "typing_extensions"]
sections = ["FUTURE", "TYPING", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
include_trailing_comma = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
  "--strict-markers",
  "--tb=short",
]
