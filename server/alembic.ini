# Alembic configuration for Policy Engine
#
# To create a new migration after changing models in database.py:
#   alembic revision --autogenerate -m "description of change"
#
# To apply all pending migrations:
#   alembic upgrade head
#
# To see current migration status:
#   alembic current

[alembic]
script_location = alembic
prepend_sys_path = .

# SQLite default — override via DATABASE_URL env var
sqlalchemy.url = sqlite+aiosqlite:///./data/policy_engine.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
