replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "ds-policy-engine"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

container:
  command: ["uvicorn"]
  args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  port: 8000

service:
  type: ClusterIP
  port: 8000

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  # Default off — opt-in per site via gitops values. Prevents an unintended
  # Ingress on the default host when someone installs the chart raw.
  enabled: false
  className: nginx
  # cert-manager provisions a per-host cert when this annotation is present
  # and tls.secretName is set. Same pattern used by ds-search, ds-catalog, etc.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ds-policy-engine.nextgen.hiro-develop.nl
  path: /
  pathType: Prefix
  tls:
    enabled: true
    # cert-manager will create / refresh this Secret in the install namespace.
    # Same name across ki/hus/uva — namespaced, so no collision.
    secretName: ds-policy-engine-tls-secret

persistence:
  enabled: true
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  mountPath: /app/data

cors:
  # Comma-separated list exposed to the app as DS__CORS_ALLOWED_ORIGINS.
  allowedOrigins: ""

docs:
  # When false the chart sets DS__DOCS_ENABLED=false, disabling /docs, /redoc, /openapi.json.
  enabled: true

dbQuery:
  # Gate for the /api/v1/db/query arbitrary-SELECT endpoint used by the
  # DB Explorer SQL console. Default OFF — exposing ad-hoc SQL even with
  # SELECT-only guards is a data-exfiltration + DoS surface unless the
  # caller is trusted. Enable only in dev/debug environments.
  enabled: false

env:
  logLevel: INFO
  # Leave empty for in-cluster installs — the chart defaults DS__NODE_NAME to
  # the release namespace (see templates/deployment.yaml). Override only if
  # the service-level tag should differ from the namespace name.
  nodeName: ""

database:
  # sqlite+aiosqlite default persists at {{ .Values.persistence.mountPath }}/policy_engine.db
  url: sqlite+aiosqlite:////app/data/policy_engine.db

opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    # Pin for reproducible deploys. Bump intentionally in a PR when upgrading.
    tag: "1.2.0"
    pullPolicy: IfNotPresent
  port: 8181
  # Mounted as /config/opa-config.yaml if provided; otherwise OPA starts with defaults.
  configYaml: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

namespace: ""
# Policy rules, role@institute → permissions. When set, a Job loads them
# after every install/upgrade and REPLACES all rules in the engine (rules
# made by hand in the UI are overwritten on the next deploy). Empty = the
# engine keeps whatever it has (first start: its built-in seed rules).
# Institute = the site name (hus, ki, uva; hiro on local kind).
#   rules:
#     - name: site-admin-hus
#       role: site_admin
#       institute: hus
#       permissions: [issuer:write, issuer:read, rules:admin, catalog:read, catalog:write]
rules: []
rulesLoader:
  # How long the Job waits for the engine to answer (it restarts on upgrades).
  waitSeconds: 300
  backoffLimit: 3

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
