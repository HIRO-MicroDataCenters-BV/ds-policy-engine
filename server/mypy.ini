[mypy]
pretty = true
show_traceback = true
color_output = true
exclude =
  .git
  __pycache__
  .venv
  build
  dist
  alembic
  tests

# Baseline strictness — relaxed because the existing app code was not written with
# full type annotations. TODO: progressively enable the disabled options below and
# remove this note once the app is fully annotated.
allow_redefinition = false
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = false
warn_unused_configs = true
warn_unused_ignores = false
